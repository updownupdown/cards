<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Solitarius | Offline</title>
    <style>
      :root {
        color-scheme: dark;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: radial-gradient(
          circle at top,
          #465564 0%,
          #343f49 48%,
          #2a323a 100%
        );
        color: #f6f8fb;
        font-family:
          Outfit,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }

      main {
        width: min(92vw, 32rem);
        border-radius: 14px;
        background: rgba(20, 24, 28, 0.82);
        box-shadow: 0 16px 36px rgba(0, 0, 0, 0.35);
        padding: 24px;
      }

      h1 {
        margin: 0 0 12px;
        font-size: 1.3rem;
        line-height: 1.2;
      }

      p {
        margin: 0;
        color: #cad3dc;
        line-height: 1.45;
      }

      .actions {
        margin-top: 16px;
      }

      a {
        color: #d8e0e8;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You are offline</h1>
      <p>
        Solitarius could not load this page without a connection. Once you are
        online, open the game again to cache it for offline play.
      </p>
      <p class="actions"><a href="./">Go to home</a></p>
    </main>
  </body>
</html>
