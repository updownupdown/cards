# The checks themselves, shared by the Checks workflow (pull requests and
# branches) and the deploy (main): lint, typecheck and jest.
name: Checks job

on:
  workflow_call:

jobs:
  static:
    name: Lint and typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

  tests:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The hint tests alone take a few minutes, so the suites are split in two
    # and run side by side.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Jest
        run: npx jest --ci --shard=${{ matrix.shard }}/2
