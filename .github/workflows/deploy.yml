name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build web
        run: npx expo export -p web

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      # Retry wrapper for transient Pages deployment failures
      - name: Deploy to GitHub Pages (attempt 1)
        id: deploy
        uses: actions/deploy-pages@v5
        continue-on-error: true

      - name: Deploy to GitHub Pages (attempt 2)
        id: deploy_retry_2
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v5
        continue-on-error: true

      - name: Deploy to GitHub Pages (attempt 3)
        id: deploy_retry_3
        if: steps.deploy.outcome == 'failure' && steps.deploy_retry_2.outcome == 'failure'
        uses: actions/deploy-pages@v5
        continue-on-error: true

      - name: Finalize deployment status
        if: always()
        run: |
          if [[ "${{ steps.deploy.outcome }}" == "success" || "${{ steps.deploy_retry_2.outcome }}" == "success" || "${{ steps.deploy_retry_3.outcome }}" == "success" ]]; then
            echo "Deployment succeeded on one of the attempts."
            exit 0
          fi
          echo "Deployment failed after 3 attempts."
          exit 1

      - name: Debug failed deployment status
        if: failure() && steps.deploy.outputs.id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOYMENT_ID: ${{ steps.deploy.outputs.id }}
        run: |
          curl -sS \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages/deployment/status/$DEPLOYMENT_ID" | jq .

      - name: Debug recent Pages deployments
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -sS \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages/deployments?per_page=5" | jq .
